<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="description" content="每天完成六样食物，每次只吃一样；其中两样固定为液体，内容可自由修改。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日六样">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>每日六样</title>
  <style>
    :root{
      --ink:#0b1f33;--ink-2:#143650;--cream:#fff7e8;--paper:#fffdf8;
      --amber:#ffc857;--amber-dark:#d88d06;--mint:#71d19a;--green:#258755;
      --coral:#f48668;--muted:#617183;--line:#dce4e8;--soft:#eef3f4;
      --shadow:0 18px 44px rgba(11,31,51,.12)
    }
    *{box-sizing:border-box}
    html{background:#e9eef0;-webkit-text-size-adjust:100%}
    body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eaf1f3 0,#f7f4ec 45%,#f7f4ec 100%);min-height:100vh}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{width:min(100%,480px);min-height:100vh;margin:0 auto;background:var(--paper);box-shadow:0 0 60px rgba(11,31,51,.1);padding-bottom:112px}
    .top{position:relative;height:214px;overflow:hidden;background:var(--ink)}
    .top img{width:100%;height:100%;object-fit:cover;display:block;opacity:.68}
    .top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,19,32,.06),rgba(5,19,32,.88))}
    .brand{position:absolute;z-index:1;left:22px;right:22px;bottom:20px;color:white;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
    .brand small{display:block;margin-bottom:5px;color:#ffe4aa;font-weight:800;letter-spacing:.12em}
    .brand h1{margin:0;font-size:2rem;line-height:1.05;letter-spacing:-.04em}
    .today-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);padding:8px 10px;border-radius:14px;font-size:.78rem;font-weight:750;white-space:nowrap}
    .install{position:absolute;z-index:2;right:16px;top:calc(14px + env(safe-area-inset-top));border:1px solid rgba(255,255,255,.35);background:rgba(11,31,51,.5);color:white;border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:750;backdrop-filter:blur(12px);display:none}
    main{padding:20px 18px}
    .view[hidden]{display:none}
    .summary{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;margin-bottom:18px}
    .ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) 0deg,#e7ecee 0deg);position:relative}
    .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--paper)}
    .ring strong{position:relative;z-index:1;font-size:1.45rem}
    .summary h2{font-size:1.18rem;margin:0 0 6px}
    .summary p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.55}
    .rule{display:flex;align-items:center;gap:10px;background:var(--ink);color:white;border-radius:16px;padding:12px 14px;margin:0 0 18px}
    .rule-icon{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;background:var(--amber);color:var(--ink);font-weight:900}
    .rule strong{display:block;font-size:.9rem;margin-bottom:2px}
    .rule span{display:block;color:#c9d6de;font-size:.78rem;line-height:1.35}
    .section-label{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:20px 2px 12px}
    .section-label h2{font-size:1rem;margin:0}
    .section-label span{color:var(--muted);font-size:.8rem}
    .food-list{display:grid;gap:10px}
    .food{width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:white;padding:12px;border-radius:18px;color:var(--ink);box-shadow:0 7px 18px rgba(11,31,51,.04);transition:.18s ease;cursor:pointer}
    .food:active{transform:scale(.985)}
    .food:focus-visible,.nav:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid rgba(255,200,87,.65);outline-offset:2px}
    .food .emoji{width:52px;height:52px;display:grid;place-items:center;background:var(--cream);border-radius:15px;font-size:1.65rem}
    .food-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
    .food strong{display:block;font-size:1rem;margin-bottom:4px}
    .food-title strong{margin:0}
    .kind-badge{display:inline-flex;align-items:center;width:max-content;border-radius:999px;background:#e8f6ff;color:#17658c;border:1px solid #b8deef;padding:3px 7px;font-size:.68rem;font-style:normal;font-weight:850;line-height:1}
    .food small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
    .check{width:30px;height:30px;border-radius:50%;border:2px solid #b9c7cf;display:grid;place-items:center;color:white;font-weight:900}
    .food.done{background:#eef9f2;border-color:#b7e3c8;cursor:default}
    .food.done .check{background:var(--green);border-color:var(--green)}
    .food.done .check::after{content:"✓"}
    .food.done strong,.food.done small{opacity:.66}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .primary,.secondary,.danger{border:0;border-radius:15px;min-height:46px;padding:11px 14px;font-weight:800;cursor:pointer}
    .primary{background:var(--amber);color:var(--ink)}
    .secondary{background:var(--soft);color:var(--ink)}
    .danger{background:#fff0ec;color:#a23f29}
    .primary:disabled,.secondary:disabled,.danger:disabled{opacity:.45;cursor:default}
    .page-head{margin:2px 2px 20px}
    .eyebrow{color:var(--amber-dark);font-size:.78rem;font-weight:850;letter-spacing:.12em}
    .page-head h2{margin:7px 0 6px;font-size:1.55rem;letter-spacing:-.025em}
    .page-head p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.55}
    .edit-list{display:grid;gap:12px}
    .edit-card{border:1px solid var(--line);border-radius:18px;background:white;padding:14px;display:grid;grid-template-columns:62px 1fr;gap:12px}
    .field label{display:block;font-size:.76rem;color:var(--muted);font-weight:700;margin:0 0 6px}
    .field input{width:100%;border:1px solid #cad5db;border-radius:12px;background:#fff;padding:10px 11px;color:var(--ink);font-size:.92rem;outline:none}
    .field input:focus{border-color:var(--amber-dark);box-shadow:0 0 0 3px rgba(255,200,87,.22)}
    .field+.field{margin-top:10px}
    .emoji-input{text-align:center;font-size:1.5rem;padding-left:6px!important;padding-right:6px!important}
    .edit-kind{display:flex;justify-content:center;margin-top:8px}
    .save-bar{position:sticky;bottom:92px;background:linear-gradient(180deg,rgba(255,253,248,0),var(--paper) 24%);padding:24px 0 4px;margin-top:4px}
    .save-bar .primary{width:100%}
    .history-list{display:grid;gap:10px}
    .day-card{border:1px solid var(--line);background:white;border-radius:17px;padding:14px}
    .day-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .day-row strong{font-size:.95rem}
    .day-row span{font-size:.8rem;color:var(--muted)}
    .mini-progress{height:8px;background:#e7ecee;border-radius:999px;overflow:hidden;margin-top:11px}
    .mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));border-radius:999px}
    .history-foods{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
    .history-foods span{background:var(--cream);border-radius:999px;padding:5px 8px;font-size:.75rem}
    .empty{border:1px dashed #bdcbd2;border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);line-height:1.6}
    .bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);background:rgba(255,253,248,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(11,31,51,.1);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:5}
    .nav{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:9px 4px;font-size:.76rem;font-weight:700;cursor:pointer}
    .nav b{display:block;font-size:1.22rem;margin-bottom:2px}
    .nav.active{background:var(--ink);color:white}
    dialog{border:0;padding:0;border-radius:24px;width:min(calc(100% - 32px),410px);color:var(--ink);box-shadow:0 26px 80px rgba(7,25,41,.3)}
    dialog::backdrop{background:rgba(5,19,32,.62);backdrop-filter:blur(3px)}
    .dialog-body{padding:23px}
    .dialog-food{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 13px;border-radius:22px;background:var(--cream);font-size:2.35rem}
    .dialog-body h2{text-align:center;margin:0 0 7px;font-size:1.32rem}
    .dialog-body p{text-align:center;margin:0;color:var(--muted);line-height:1.55;font-size:.9rem}
    .dialog-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:9px;margin-top:20px}
    .toast{position:fixed;left:50%;bottom:105px;z-index:9;transform:translate(-50%,20px);background:var(--ink);color:white;padding:11px 15px;border-radius:999px;font-size:.84rem;font-weight:700;opacity:0;pointer-events:none;transition:.22s ease;white-space:nowrap;box-shadow:var(--shadow)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (min-width:600px){body{padding:24px 0}.app{border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px)}.bottom{bottom:24px;border:1px solid rgba(11,31,51,.1);border-radius:18px;width:452px;box-shadow:var(--shadow)}.toast{bottom:125px}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <img src="assets/six-foods.png" alt="六份不同的日常食物">
      <button class="install" id="installButton">添加到主屏幕</button>
      <div class="brand"><div><small>一次一样</small><h1>每日六样</h1></div><div class="today-chip" id="dateLabel"></div></div>
    </header>
    <main>
      <section class="view" id="todayView">
        <section class="summary" aria-label="今日进度">
          <div class="ring" id="ring"><strong id="score">0/6</strong></div>
          <div><h2 id="progressTitle">从第一样开始</h2><p>今天完成六样就收工，顺序由你决定。</p></div>
        </section>
        <div class="rule"><div class="rule-icon">1</div><div><strong>一次只吃一样</strong><span>前两样固定为液体；每次只确认一样，不把几样混在一起。</span></div></div>
        <div class="section-label"><h2>今天要吃的六样</h2><span>点一项打卡</span></div>
        <div class="food-list" id="foodList"></div>
        <div class="actions">
          <button class="secondary" id="undoButton">撤销上一项</button>
          <button class="danger" id="resetButton">清空今天</button>
        </div>
      </section>

      <section class="view" id="customView" hidden>
        <div class="page-head"><div class="eyebrow">CUSTOMIZE</div><h2>自定义你的六样</h2><p>前两样固定为液体，其余四样为普通食物。名称、图标和简单吃法都能改，已有打卡不会丢失。</p></div>
        <form id="customForm">
          <div class="edit-list" id="editList"></div>
          <div class="save-bar"><button class="primary" type="submit">保存六样</button></div>
        </form>
      </section>

      <section class="view" id="historyView" hidden>
        <div class="page-head"><div class="eyebrow">HISTORY</div><h2>最近记录</h2><p>每一天都单独计算，过零点会自动开始新的一天。</p></div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>
  </div>

  <nav class="bottom" aria-label="主导航">
    <button class="nav active" data-view="todayView" aria-current="page"><b>◉</b>今天</button>
    <button class="nav" data-view="customView"><b>✎</b>自定义</button>
    <button class="nav" data-view="historyView"><b>▦</b>记录</button>
  </nav>

  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <div class="dialog-body">
      <div class="dialog-food" id="dialogEmoji"></div>
      <h2 id="confirmTitle"></h2>
      <p id="dialogNote"></p>
      <div class="dialog-actions">
        <button class="secondary" id="cancelConfirm">先不吃</button>
        <button class="primary" id="confirmEat">确认吃这一样</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (()=>{
      'use strict';
      const STORAGE_KEY='dailySix.v1';
      const DEFAULT_FOODS=[
        {id:'food-1',kind:'liquid',emoji:'🥛',name:'液体一',note:'牛奶、豆浆或其他饮品'},
        {id:'food-2',kind:'liquid',emoji:'🥤',name:'液体二',note:'蔬菜汁、清汤或其他饮品'},
        {id:'food-3',kind:'food',emoji:'🥣',name:'酸奶燕麦',note:'无糖酸奶配燕麦'},
        {id:'food-4',kind:'food',emoji:'🥦',name:'绿色蔬菜',note:'清炒、白灼或凉拌'},
        {id:'food-5',kind:'food',emoji:'◻️',name:'豆腐',note:'煎、炖或凉拌'},
        {id:'food-6',kind:'food',emoji:'🍌',name:'香蕉',note:'一根即可'}
      ];
      const LEGACY_DEFAULTS=[
        {emoji:'🍠',name:'红薯',note:'蒸或烤，简单吃'},
        {emoji:'🥚',name:'鸡蛋',note:'水煮蛋或蒸蛋'}
      ];

      const $=selector=>document.querySelector(selector);
      const $$=selector=>[...document.querySelectorAll(selector)];
      const localDateKey=(date=new Date())=>{
        const year=date.getFullYear();
        const month=String(date.getMonth()+1).padStart(2,'0');
        const day=String(date.getDate()).padStart(2,'0');
        return `${year}-${month}-${day}`;
      };
      const makeId=()=>`entry-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const clean=value=>String(value??'').trim();
      const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const formatTime=value=>{
        const date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
      };

      function loadState(){
        let parsed={};
        try{parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{}}catch{}
        const foods=Array.isArray(parsed.foods)&&parsed.foods.length===6
          ? parsed.foods.map((food,index)=>{
              const legacy=LEGACY_DEFAULTS[index];
              const wasLegacyLiquidSlot=Boolean(legacy&&clean(food.emoji)===legacy.emoji&&clean(food.name)===legacy.name&&clean(food.note)===legacy.note);
              const source=wasLegacyLiquidSlot?DEFAULT_FOODS[index]:food;
              return {id:clean(source.id)||`food-${index+1}`,kind:index<2?'liquid':'food',emoji:clean(source.emoji)||'●',name:clean(source.name)||`第 ${index+1} 样`,note:clean(source.note)};
            })
          : DEFAULT_FOODS.map(food=>({...food}));
        const days=parsed.days&&typeof parsed.days==='object'?parsed.days:{};
        Object.keys(days).forEach(date=>{
          if(Array.isArray(days[date])){
            days[date]={entries:days[date].map((value,index)=>({id:makeId(),foodId:typeof value==='number'?(foods[value]?.id||foods[index]?.id):value,time:new Date().toISOString()})).filter(item=>item.foodId)};
          }
          if(!Array.isArray(days[date]?.entries))days[date]={entries:[]};
          days[date].entries=days[date].entries.map(entry=>({
            id:clean(entry.id)||makeId(),
            foodId:clean(entry.foodId),
            time:entry.time||new Date().toISOString(),
            foodName:clean(entry.foodName),
            foodEmoji:clean(entry.foodEmoji),
            foodKind:clean(entry.foodKind)
          })).filter(entry=>entry.foodId);
        });
        return {foods,days};
      }

      let state=loadState();
      let pendingFoodId=null;
      let deferredInstallPrompt=null;
      let toastTimer=null;

      function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
      function getToday(){
        const key=localDateKey();
        if(!state.days[key])state.days[key]={entries:[]};
        return state.days[key];
      }
      function completedIds(day=getToday()){return new Set(day.entries.map(entry=>entry.foodId));}
      function foodById(id){return state.foods.find(food=>food.id===id);}
      function showToast(message){
        const toast=$('#toast');toast.textContent=message;toast.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
      }
      function formatDate(dateKey){
        const [year,month,day]=dateKey.split('-').map(Number);
        const date=new Date(year,month-1,day);
        const today=localDateKey();
        const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
        const prefix=dateKey===today?'今天':dateKey===localDateKey(yesterday)?'昨天':'';
        const formatted=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(date);
        return prefix?`${prefix} · ${formatted}`:formatted;
      }

      function renderToday(){
        const day=getToday();
        const done=completedIds(day);
        const count=Math.min(done.size,6);
        $('#score').textContent=`${count}/6`;
        $('#ring').style.background=`conic-gradient(var(--amber) ${count/6*360}deg,#e7ecee 0deg)`;
        $('#progressTitle').textContent=count===6?'今天六样都完成了':count?`还差 ${6-count} 样`:'从第一样开始';
        $('#foodList').innerHTML=state.foods.map((food,index)=>{
          const entry=day.entries.find(item=>item.foodId===food.id);
          const isDone=Boolean(entry);
          const detail=isDone?`已完成${formatTime(entry.time)?` · ${formatTime(entry.time)}`:''}`:(food.note||'按自己的方式吃');
          const badge=food.kind==='liquid'?'<em class="kind-badge">液体</em>':'';
          return `<button class="food ${isDone?'done':''}" data-food-id="${escapeHtml(food.id)}" aria-pressed="${isDone}" ${isDone?'disabled':''}><span class="emoji">${escapeHtml(food.emoji)}</span><span><span class="food-title"><strong>${index+1}. ${escapeHtml(food.name)}</strong>${badge}</span><small>${escapeHtml(detail)}</small></span><span class="check" aria-hidden="true"></span></button>`;
        }).join('');
        $$('.food:not(:disabled)').forEach(button=>button.addEventListener('click',()=>openConfirm(button.dataset.foodId)));
        $('#undoButton').disabled=day.entries.length===0;
        $('#resetButton').disabled=day.entries.length===0;
      }

      function renderCustom(){
        $('#editList').innerHTML=state.foods.map((food,index)=>`<section class="edit-card"><div><div class="field"><label for="emoji-${index}">图标</label><input class="emoji-input" id="emoji-${index}" name="emoji-${index}" value="${escapeHtml(food.emoji)}" maxlength="4" aria-label="第 ${index+1} 样图标"></div>${food.kind==='liquid'?'<div class="edit-kind"><span class="kind-badge">固定液体</span></div>':''}</div><div><div class="field"><label for="name-${index}">第 ${index+1} 样名称</label><input id="name-${index}" name="name-${index}" value="${escapeHtml(food.name)}" maxlength="18" required></div><div class="field"><label for="note-${index}">简单吃法（可不填）</label><input id="note-${index}" name="note-${index}" value="${escapeHtml(food.note)}" maxlength="36"></div></div></section>`).join('');
      }

      function renderHistory(){
        const keys=Object.keys(state.days).sort().reverse().slice(0,14);
        if(!keys.length){$('#historyList').innerHTML='<div class="empty">还没有打卡记录。<br>先从今天的一样开始。</div>';return;}
        $('#historyList').innerHTML=keys.map(key=>{
          const day=state.days[key];
          const ids=[...new Set(day.entries.map(entry=>entry.foodId))];
          const count=Math.min(ids.length,6);
          const entries=day.entries.map(entry=>{
            const current=foodById(entry.foodId);
            return {emoji:entry.foodEmoji||current?.emoji||'●',name:entry.foodName||current?.name||'已记录食物'};
          });
          const summary=count===6?'已完成':`完成 ${count}/6`;
          return `<article class="day-card"><div class="day-row"><strong>${escapeHtml(formatDate(key))}</strong><span>${escapeHtml(summary)}</span></div><div class="mini-progress"><i style="width:${count/6*100}%"></i></div>${entries.length?`<div class="history-foods">${entries.map(entry=>`<span>${escapeHtml(entry.emoji)} ${escapeHtml(entry.name)}</span>`).join('')}</div>`:''}</article>`;
        }).join('');
      }

      function renderAll(){renderToday();renderCustom();renderHistory();saveState();}

      function openConfirm(foodId){
        const food=foodById(foodId);if(!food)return;
        pendingFoodId=foodId;
        $('#dialogEmoji').textContent=food.emoji;
        $('#confirmTitle').textContent=`这次只吃：${food.name}`;
        $('#dialogNote').textContent=`${food.kind==='liquid'?'固定液体 · ':''}${food.note||'确认后会记入今天的进度。'}`;
        $('#confirmDialog').showModal();
      }

      function recordFood(foodId){
        const day=getToday();
        const food=foodById(foodId);
        if(!food)throw new Error('没有找到这一样食物');
        if(day.entries.some(entry=>entry.foodId===foodId))throw new Error('今天已经吃过这一样');
        day.entries.push({id:makeId(),foodId,time:new Date().toISOString(),foodName:food.name,foodEmoji:food.emoji,foodKind:food.kind});
        saveState();renderToday();renderHistory();
        return {date:localDateKey(),foodId,completed:completedIds(day).size,total:6};
      }

      $('#confirmEat').addEventListener('click',()=>{
        if(!pendingFoodId)return;
        try{
          const food=foodById(pendingFoodId);const result=recordFood(pendingFoodId);
          $('#confirmDialog').close();pendingFoodId=null;
          showToast(result.completed===6?'今天六样全部完成！':`${food.name} 已完成 · ${result.completed}/6`);
        }catch(error){showToast(error.message)}
      });
      $('#cancelConfirm').addEventListener('click',()=>{$('#confirmDialog').close();pendingFoodId=null;});
      $('#confirmDialog').addEventListener('click',event=>{if(event.target===$('#confirmDialog')){$('#confirmDialog').close();pendingFoodId=null;}});

      $('#undoButton').addEventListener('click',()=>{
        const entry=getToday().entries.pop();if(!entry)return;
        saveState();renderToday();renderHistory();showToast(`已撤销：${foodById(entry.foodId)?.name||'上一项'}`);
      });
      $('#resetButton').addEventListener('click',()=>{
        if(!getToday().entries.length)return;
        if(window.confirm('确定清空今天的全部打卡吗？自定义的六样不会改变。')){
          state.days[localDateKey()]={entries:[]};saveState();renderToday();renderHistory();showToast('今天的打卡已清空');
        }
      });

      $('#customForm').addEventListener('submit',event=>{
        event.preventDefault();
        state.foods=state.foods.map((food,index)=>({
          ...food,
          emoji:clean($(`#emoji-${index}`).value)||'●',
          name:clean($(`#name-${index}`).value)||`第 ${index+1} 样`,
          note:clean($(`#note-${index}`).value)
        }));
        saveState();renderAll();switchView('todayView');showToast('你的六样已保存');
      });

      function switchView(viewId){
        $$('.view').forEach(view=>view.hidden=view.id!==viewId);
        $$('.nav').forEach(button=>{
          const active=button.dataset.view===viewId;
          button.classList.toggle('active',active);
          if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
        });
        if(viewId==='historyView')renderHistory();
        if(viewId==='customView')renderCustom();
        window.scrollTo({top:0,behavior:'smooth'});
      }
      $$('.nav').forEach(button=>button.addEventListener('click',()=>switchView(button.dataset.view)));

      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;$('#installButton').style.display='block';});
      $('#installButton').addEventListener('click',async()=>{
        if(!deferredInstallPrompt)return;
        deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$('#installButton').style.display='none';
      });
      window.addEventListener('appinstalled',()=>showToast('已添加到主屏幕'));

      function registerWebMcp(){
        const context=document.modelContext;
        if(!context?.registerTool)return;
        const report=error=>console.warn('WebMCP tool unavailable',error);
        try{
          void Promise.resolve(context.registerTool({
            name:'get_daily_six_progress',title:'查看每日六样进度',description:'读取今天六样食物的完成情况，不修改记录。',
            inputSchema:{type:'object',properties:{},additionalProperties:false},
            annotations:{readOnlyHint:true,untrustedContentHint:false},
            execute(){const day=getToday();const done=completedIds(day);return {date:localDateKey(),completed:done.size,total:6,remaining:state.foods.filter(food=>!done.has(food.id)).map(food=>({id:food.id,name:food.name,kind:food.kind}))};}
          })).catch(report);
          void Promise.resolve(context.registerTool({
            name:'record_one_food',title:'记录吃了一样',description:'为今天记录一个指定食物。每次调用只记录一样，已完成的食物不会重复记录。',
            inputSchema:{type:'object',properties:{foodId:{type:'string',enum:state.foods.map(food=>food.id)}},required:['foodId'],additionalProperties:false},
            annotations:{readOnlyHint:false,untrustedContentHint:false},
            execute(input){if(!input||typeof input.foodId!=='string')throw new Error('需要提供 foodId');const result=recordFood(input.foodId);showToast(`${foodById(input.foodId).name} 已记下`);return result;}
          })).catch(report);
        }catch(error){report(error)}
      }

      $('#dateLabel').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
      $('#dateLabel').dataset.date=localDateKey();
      renderAll();registerWebMcp();
      if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
      window.setInterval(()=>{if($('#dateLabel').dataset.date!==localDateKey())location.reload();},60000);
    })();
  </script>
</body>
</html>
